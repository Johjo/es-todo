[project]
name = "todolist-back-python"
version = "0.1.0"
description = ""
authors = [
    {name = "Jonathan L.",email = "j.laurent@efficacity.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "expression[pydandic] (>=5.6.0,<6.0.0)",
    "bottle (>=0.13.4,<0.14.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "bottle-utils (>=2.0.post2,<3.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.poetry]
packages = [
{ include = "src/" },
{ include = "src/**/*.py" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "faker (>=40.36.0,<41.0.0)",
    "webtest (>=3.0.7,<4.0.0)",
    "approvaltests (>=19.1.0,<20.0.0)",
    "pytest-approvaltests (>=0.2.4,<0.3.0)"
]
